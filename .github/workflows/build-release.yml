name: Build and Release HyprWin

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*" # Триггерится только на теги версий, например: v0.1.0-alpha
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # Дает право GitHub Actions создавать релизы и заливать туда файлы

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Prepare Release Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{github.workspace}}/publish/HyprWin"
        Copy-Item -Path "${{github.workspace}}/build/Release/HyprWin.exe" -Destination "${{github.workspace}}/publish/HyprWin/"
        Copy-Item -Path "${{github.workspace}}/scripts" -Destination "${{github.workspace}}/publish/HyprWin/" -Recurse
        Copy-Item -Path "${{github.workspace}}/assets" -Destination "${{github.workspace}}/publish/HyprWin/" -Recurse
        if (Test-Path "${{github.workspace}}/LICENSE") { Copy-Item "${{github.workspace}}/LICENSE" "${{github.workspace}}/publish/HyprWin/" }
        if (Test-Path "${{github.workspace}}/README.md") { Copy-Item "${{github.workspace}}/README.md" "${{github.workspace}}/publish/HyprWin/" }
        
        # Сжимаем всю папку публикации в один ZIP-архив для релиза
        Compress-Archive -Path "${{github.workspace}}/publish/HyprWin/*" -DestinationPath "${{github.workspace}}/publish/HyprWin-Windows-x64.zip" -Force

    - name: Upload Artifact (For testing)
      uses: actions/upload-artifact@v4
      with:
        name: HyprWin-Windows-x64
        path: ${{github.workspace}}/publish/HyprWin/

    # Этот шаг запустится ТОЛЬКО если ты запушил тег версии (например v0.1.0)
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: ${{github.workspace}}/publish/HyprWin-Windows-x64.zip
        tag_name: ${{ github.ref_name }}
        name: HyprWin ${{ github.ref_name }}
        body: |
          Automated Release of HyprWin ${{ github.ref_name }}
          
          ### Quick Start
          1. Download the `HyprWin-Windows-x64.zip` asset below.
          2. Extract the archive.
          3. Run `HyprWin.exe`.
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}